
services:
  product-backend:
    build:
      context: .
      dockerfile: Dockerfile
#    container_name: product-backend
    restart: always
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-db:5432/databinding_session07
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234$
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      product-db:
        condition: service_healthy
    deploy:
      replicas: 3

  nginx:
    image: nginx:latest
    container_name: product-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  product-db:
    image: postgres:13
    container_name: product-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234$
      POSTGRES_DB: databinding_session07
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d databinding_session07"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  product-db-data:
